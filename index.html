<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>CN301-394 Fault Tracking System</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0;color:#17305c}
header{background:#173b73;color:white;padding:20px;text-align:center}
main{padding:20px}
.car{background:#fff;margin:8px 0;padding:12px;border-radius:8px}
.head{display:flex;align-items:center;gap:10px}
.row{display:flex;gap:6px;align-items:center;margin-top:8px;padding:8px;background:#f7f9fc}
.status{border-radius:15px;padding:6px 12px;font-weight:bold}
.fault{background:#ffd6d6}.repair{background:#ffe5a8}.fixed{background:#c9f0c9}.pending{background:#cfe3ff}.clear{background:#ddd}
input,select,textarea,button{padding:7px}
textarea{width:260px;height:35px}
</style>
</head>
<body>
<header><h1>故障追蹤系統 / Fault Tracking System</h1></header>
<main>
<input id="search" placeholder="搜尋車號 / Search" oninput="render()">
<div id="app"></div>
</main>
<script>
const cars=["CN301", "CN302", "CN303", "CN304", "CN305", "CN306", "CN307", "CN308", "CN309", "CN310", "CN311", "CN312", "CN313", "CN314", "CN315", "CN316", "CN317", "CN318", "CN319", "CN320", "CN321", "CN322", "CN323", "CN324", "CN325", "CN326", "CN327", "CN328", "CN329", "CN330", "CN331", "CN332", "CN333", "CN334", "CN335", "CN336", "CN337", "CN338", "CN339", "CN340", "CN341", "CN342", "CN343", "CN344", "CN345", "CN346", "CN347", "CN348", "CN349", "CN350", "CN351", "CN352", "CN353", "CN354", "CN355", "CN356", "CN357", "CN358", "CN359", "CN360", "CN361", "CN362", "CN363", "CN364", "CN365", "CN366", "CN367", "CN368", "CN369", "CN370", "CN371", "CN372", "CN373", "CN374", "CN375", "CN376", "CN377", "CN378", "NMS381", "NMS382", "NMS383", "NMS384", "SSS391", "SSS392", "SSS393", "SSS394"];
let data=JSON.parse(localStorage.getItem("cn_fault_final")||"[]");

function save(){localStorage.setItem("cn_fault_final",JSON.stringify(data));}
function color(s){
 if(s.includes("Fault"))return"fault";
 if(s.includes("Repair"))return"repair";
 if(s.includes("Fixed"))return"fixed";
 if(s.includes("Pending"))return"pending";
 return"clear";
}
function add(car){
 data.push({car,status:"Fault / 故障",desc:"",tech:"",cat:"",wit:"",date:new Date().toLocaleString()});
 save();render();
}
function render(){
 let k=document.getElementById("search").value.toUpperCase(),h="";
 cars.filter(c=>c.includes(k)).forEach(c=>{
  h+=`<div class="car"><div class="head"><b>${c}</b><button onclick="add('${c}')">＋ Add Fault / 新增故障</button></div>`;
  data.map((r,i)=>({r,i})).filter(x=>x.r.car==c).forEach(x=>{
   let r=x.r,i=x.i;
   h+=`<div class="row">
   <span class="status ${color(r.status)}">${r.status}</span>
   <select onchange="data[${i}].status=this.value;save();render()">
   <option>${r.status}</option><option>Fault / 故障</option><option>Under Repair / 維修中</option><option>Fixed / 已修復</option><option>Pending / 待確認</option><option>All Clear / 均完成</option></select>
   <textarea onchange="data[${i}].desc=this.value;save()" placeholder="Fault Description / 故障描述">${r.desc}</textarea>
   <input value="${r.tech}" placeholder="Repair Technician / 維修人員" onchange="data[${i}].tech=this.value;save()">
   <input value="${r.cat}" placeholder="Category / 分類" onchange="data[${i}].cat=this.value;save()">
   <input value="${r.wit}" placeholder="Witness / 見證人" onchange="data[${i}].wit=this.value;save()">
   <button onclick="data.splice(${i},1);save();render()">X</button>
   </div>`;
  });
  h+="</div>";
 });
 document.getElementById("app").innerHTML=h;
}
render();
</script>
</body>
</html>
